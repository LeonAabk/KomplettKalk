<!DOCTYPE html>
<html lang="no" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematikk-Assistent</title>

    <!-- CSS -->
    <link rel="stylesheet" href="src/css/theme.css">
    <link rel="stylesheet" href="src/css/style.css">

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" integrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q71bQzFsqO0" crossorigin="anonymous">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>

    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" integrity="sha384-cpW21h6RZv/phavutF+AuVYrr+dA8xD9zs6FwLpaCct6O9ctzYFfLe4219uHSabo" crossorigin="anonymous"></script>

    <!-- App JS -->
    <script type="module" src="src/js/main.js" defer></script>
</head>
<body>
    <header class="app-header">
        <h1>Matematikk-Assistent</h1>
        <div class="header-controls">
            <input type="search" id="global-search" placeholder="Søk i emner..." aria-label="Søk i emner">
            <button id="theme-toggle" aria-label="Bytt tema">🌓</button>
        </div>
    </header>

    <div class="app-container">
        <!-- Navigation / Categories -->
        <nav class="sidebar-nav" aria-label="Hovedmeny">
            <ul>
                <li><a href="#algebra" class="active">Algebra</a></li>
                <li><a href="#geometri">Geometri</a></li>
                <li><a href="#grunnleggende">Grunnleggende</a></li>
            </ul>
        </nav>

        <!-- Main Dashboard -->
        <main class="main-dashboard" role="main">
            <section id="module-quadratic" class="educational-module" aria-labelledby="quadratic-title">
                <h2 id="quadratic-title">Topp- og Bunnpunkt for Andregradsfunksjon</h2>
                <p>Skriv inn koeffisientene for funksjonen <em>f(x) = ax² + bx + c</em></p>

                <form id="quadratic-form" class="math-form" novalidate>
                    <div class="input-group">
                        <label for="coeff-a">a =</label>
                        <input type="number" id="coeff-a" name="a" step="any" required aria-label="Koeffisient a">
                    </div>
                    <div class="input-group">
                        <label for="coeff-b">b =</label>
                        <input type="number" id="coeff-b" name="b" step="any" required aria-label="Koeffisient b">
                    </div>
                    <div class="input-group">
                        <label for="coeff-c">c =</label>
                        <input type="number" id="coeff-c" name="c" step="any" required aria-label="Koeffisient c">
                    </div>

                    <button type="submit" class="btn-primary">Beregn og tegn graf</button>
                    <button type="button" id="btn-show-steps" class="btn-secondary" aria-expanded="false" disabled>Vis utregning</button>
                </form>

                <div id="validation-hint" class="hint-box" aria-live="polite" hidden></div>

                <div id="step-by-step-container" class="steps-box" aria-live="polite" hidden>
                    <h3>Utregning:</h3>
                    <div id="steps-content"></div>
                </div>
            </section>
        </main>

        <!-- Quick-Graph Sidebar -->
        <aside class="quick-graph-sidebar" aria-labelledby="graph-title">
            <h2 id="graph-title">Hurtig-Graf</h2>
            <div class="chart-container">
                <canvas id="quick-graph-canvas" aria-label="Graf av funksjonen"></canvas>
            </div>
            <div id="graph-details" class="graph-details" aria-live="polite">
                <!-- Data for top/bottom point, roots will be rendered here -->
            </div>
        </aside>
    </div>
</body>
</html>
